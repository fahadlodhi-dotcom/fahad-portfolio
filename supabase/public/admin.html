<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Fahad's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root{--p:#7c5cff;--s:#ff5c8a;--bg:#f7f7fc;--card:#fff;--text:#16142b;--muted:#6b6a85;--border:#e7e5f2}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    h1,h2{font-family:'Space Grotesk',sans-serif}
    .login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
    .login{width:100%;max-width:420px;background:var(--card);padding:40px;border-radius:24px;box-shadow:0 20px 60px rgba(74,55,140,.12);border:1px solid var(--border)}
    .login .brand{font-size:2rem;font-weight:700;text-align:center;margin-bottom:5px}.login .brand span{color:var(--p)}
    .login p{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:28px}
    .login input{width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:.95rem;margin-bottom:14px}
    .login input:focus{outline:none;border-color:var(--p)}
    .login button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(120deg,var(--p),var(--s));color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;font-family:inherit}
    .login .err{color:#ef4444;font-size:.85rem;text-align:center;margin-top:12px;min-height:20px}
    .login .hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:14px}
    .app{display:none;max-width:1000px;margin:auto;padding:30px 20px 60px}
    .top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:30px}
    .top h1{font-size:1.8rem}.top h1 span{color:var(--p)}
    .top-actions{display:flex;gap:14px;align-items:center}
    .top a,.top button{color:var(--muted);font-size:.85rem;font-weight:600;text-decoration:none;background:none;border:none;cursor:pointer;font-family:inherit}
    .top a:hover,.top button:hover{color:var(--p)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center}
    .stat strong{display:block;font-family:'Space Grotesk';font-size:2rem;color:var(--p)}
    .stat span{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
    .toolbar h2{font-size:1.2rem}.toolbar button{padding:9px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;font-family:inherit;font-size:.85rem}
    .toolbar button:hover{border-color:var(--p);color:var(--p)}
    .msg{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:14px;position:relative;transition:.2s}
    .msg.unread{border-left:4px solid var(--p)}
    .msg:hover{box-shadow:0 10px 30px rgba(74,55,140,.08)}
    .msg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}
    .msg-from{font-weight:700;font-size:1.05rem}.msg-from small{font-weight:500;color:var(--muted);margin-left:8px}
    .msg-subject{color:var(--p);font-weight:600;margin:6px 0;font-size:.92rem}
    .msg-body{color:var(--muted);font-size:.92rem;line-height:1.6;white-space:pre-wrap;margin:10px 0}
    .msg-meta{font-size:.75rem;color:var(--muted)}
    .msg-actions{display:flex;gap:8px}
    .msg-actions button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:6px 9px;border-radius:8px;transition:.2s}
    .msg-actions button:hover{background:rgba(124,92,255,.1);color:var(--p)}
    .msg-actions .del:hover{background:rgba(239,68,68,.1);color:#ef4444}
    .empty{text-align:center;padding:60px 20px;color:var(--muted)}
    .empty i{font-size:3rem;color:var(--border);margin-bottom:15px}
    .badge-new{background:var(--p);color:#fff;font-size:.65rem;padding:3px 8px;border-radius:20px;margin-left:8px;font-weight:700}
    .user-pill{background:rgba(124,92,255,.1);color:var(--p);padding:6px 12px;border-radius:20px;font-size:.78rem;font-weight:600}
    @media(max-width:600px){.stats{grid-template-columns:1fr}.msg-head{flex-direction:column}}
  </style>
</head>
<body>

  <!-- Login -->
  <div class="login-wrap" id="loginWrap">
    <form class="login" id="loginForm">
      <div class="brand">Fahad<span>.</span></div>
      <p>Admin panel — Supabase Auth 🔐</p>
      <input type="email" id="email" placeholder="Email" value="fahadrafi.mkd@gmail.com" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">Sirf aapka Supabase account login kar sakta hai.</div>
    </form>
  </div>

  <!-- App -->
  <div class="app" id="app">
    <div class="top">
      <h1><span>Messages</span> Dashboard</h1>
      <div class="top-actions">
        <span class="user-pill" id="userPill"></span>
        <a href="/"><i class="fa-solid fa-arrow-left"></i> Site</a>
        <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="sTotal">0</strong><span>Total Messages</span></div>
      <div class="stat"><strong id="sUnread">0</strong><span>Unread</span></div>
      <div class="stat"><strong id="sVisitors">0</strong><span>Visitors</span></div>
    </div>
    <div class="toolbar">
      <h2>Inbox <span id="countLabel" style="color:var(--muted);font-size:.85rem"></span></h2>
      <button onclick="loadAll()"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>
    <div id="messageList"></div>
  </div>

  <!-- Supabase JS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    // ◀️◀️◀️ AAPKA PUBLIC KEY — frontend ke liye safe hai (RLS protect karta hai)
    const SUPABASE_URL = 'https://lolxsnquydefoxubpbmi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rqhwgGr6MyRR0GXTNi7svw_LauxwSkO';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const loginWrap = document.getElementById('loginWrap');
    const app = document.getElementById('app');
    const loginErr = document.getElementById('loginErr');
    let accessToken = null;

    // Session restore
    (async () => {
      const { data } = await sb.auth.getSession();
      if (data?.session) { accessToken = data.session.access_token; showApp(data.session.user.email); }
    })();

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      loginErr.textContent = '';
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      const { data, error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      });
      btn.disabled = false;
      if (error) { loginErr.textContent = '❌ ' + error.message; return; }
      accessToken = data.session.access_token;
      showApp(data.user.email);
    });

    function showApp(email) {
      loginWrap.style.display = 'none';
      app.style.display = 'block';
      document.getElementById('userPill').textContent = '👤 ' + email;
      loadAll();
    }

    async function logout() {
      await sb.auth.signOut();
      accessToken = null;
      app.style.display = 'none';
      loginWrap.style.display = 'grid';
      document.getElementById('password').value = '';
    }

    function headers() { return { 'x-access-token': accessToken }; }

    async function loadAll() { await loadMessages(); await loadStats(); }

    async function loadStats() {
      const r = await fetch('/api/admin/stats', { headers: headers() });
      const d = await r.json();
      if (d.success) {
        document.getElementById('sTotal').textContent = d.messages;
        document.getElementById('sUnread').textContent = d.unread;
        document.getElementById('sVisitors').textContent = d.visitors;
      }
    }

    async function loadMessages() {
      const res = await fetch('/api/messages', { headers: headers() });
      if (!res.ok) { logout(); return; }
      const data = await res.json();
      const list = document.getElementById('messageList');
      document.getElementById('countLabel').textContent = `(${data.messages.length})`;

      if (!data.messages.length) {
        list.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i><p>Abhi koi message nahi hai.</p></div>';
        return;
      }

      list.innerHTML = data.messages.map(m => `
        <div class="msg ${m.is_read ? '' : 'unread'}" id="msg-${m.id}">
          <div class="msg-head">
            <div>
              <span class="msg-from">${esc(m.name)} ${m.is_read ? '' : '<span class="badge-new">NEW</span>'}
                <small>${esc(m.email)}</small></span>
              <div class="msg-subject">${esc(m.subject)}</div>
            </div>
            <div class="msg-actions">
              ${m.is_read ? '' : `<button title="Mark as read" onclick="markRead(${m.id})"><i class="fa-solid fa-check"></i></button>`}
              <button class="del" title="Delete" onclick="delMsg(${m.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="msg-body">${esc(m.message)}</div>
          <div class="msg-meta"><i class="fa-solid fa-clock"></i> ${new Date(m.created_at).toLocaleString()}</div>
        </div>`).join('');
    }

    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

    async function markRead(id) {
      await fetch(`/api/messages/${id}/read`, { method:'PATCH', headers: headers() });
      loadAll();
    }

    async function delMsg(id) {
      if (!confirm('Ye message delete karna hai?')) return;
      await fetch(`/api/messages/${id}`, { method:'DELETE', headers: headers() });
      loadAll();
    }
  </script>
</body>
</html>
